spring:
  application:
    name: app-subir-archivos

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${URL}
    username: ${USER}
    password: ${PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect